name: Chaos Engineering

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  chaos-tests:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r core/requirements.txt
        pip install pytest pytest-django pytest-mock pytest-cov

    - name: Run Chaos Engineering Simulations
      run: |
        bash scripts/run_chaos_tests.sh

    - name: Run Chaos Visualizer (Smoke Test)
      run: |
        python scripts/simulate_chaos.py all
